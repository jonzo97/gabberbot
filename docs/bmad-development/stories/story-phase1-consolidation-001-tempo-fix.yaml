dev_notes:
  implementation_hints: |
    Investigation Starting Points:

    1. bmad_standalone.py SimpleMIDIExporter (lines 72-73):
       - Check: f.write(struct.pack('>H', 480))  # Ticks per quarter note
       - Check: tempo = int(60000000 / bpm)  # Tempo in microseconds
       - Verify this matches mido library standard

    2. Beat → Sample Conversion (audio rendering):
       - Formula should be: samples = beats * (60.0 / BPM) * sample_rate
       - Check for off-by-one errors or doubled BPM values

    3. MIDI Note Timing:
       - start_time and duration should be in beats (not seconds or ticks)
       - Conversion to ticks: ticks = beats * ticks_per_beat
       - Verify ticks_per_beat = 480 (MIDI standard)

    Debugging Approach:
    - Add logging to tempo calculations
    - Export same pattern with known-good library (mido) for comparison
    - Analyze .mid file with MIDI inspector tool
    - Generate audio and measure actual tempo with librosa beat detection

  reference_implementations: |
    Correct MIDI Export (cli_shared/models/midi_clips.py):
    - Review MIDIClip.to_midi() method
    - Check if experimental files reimplemented this incorrectly

    Tempo Validation Tools:
    - librosa.beat.tempo() for audio tempo detection
    - mido library for MIDI file inspection
    - music21 library for musical analysis

  technical_decisions: |
    Decision 1: MIDI Ticks Per Quarter Note
    - Standard: 480 TPQN (Division in MIDI file header)
    - Rationale: Compatible with all DAWs, sufficient timing resolution
    - Formula: tick_time = (60_000_000 / BPM) / 480

    Decision 2: Timing Storage Format
    - Use beats (floats) for all internal timing (Story 001 standard)
    - Convert to samples at audio rendering time
    - Convert to MIDI ticks at export time
    - Rationale: BPM-independent representation

    Decision 3: Tempo Source of Truth
    - Single BPM value stored in pattern config or global settings
    - No hardcoded BPM values in calculations
    - All conversions reference this single source

