context:
  business_value: |
    CRITICAL BLOCKER: Music generation currently produces unplayable output at 4x intended tempo.
    This bug makes the entire system unusable for music production. No consolidation work can
    proceed until music plays at correct tempo.

    User Impact: Users cannot use generated music (plays at 720 BPM instead of 180 BPM for
    hardcore tracks). This is the single most critical bug blocking all development.

    From Risk Assessment DATA-001: "4x tempo bug makes music unplayable - CRITICAL risk
    requiring immediate resolution before consolidation begins."

  epic_relationship: |
    This story implements Epic Story 1: Critical Bug Fix. It MUST be completed before
    Stories 2-6 can begin. Consolidating broken code would waste weeks of effort.

    Gate Criteria: This story completion is MANDATORY before proceeding to Story 2.
    All tempo accuracy tests MUST pass before any consolidation work begins.

  current_state: |
    Broken System Status:
    - Music generation produces output 4x too fast (confirmed by user report)
    - Likely caused by: BPM/timing calculation error or MIDI ticks conversion mismatch
    - Multiple potential sources:
      * bmad_standalone.py SimpleMIDIExporter (lines 72-73)
      * Timing calculations in pattern generators
      * Audio rendering pipeline tempo conversion
    - No tempo validation tests exist to catch this regression
    - 30-minute production run (83 sessions, 1660 patterns) all at wrong tempo

  root_cause_hypotheses: |
    From Risk Assessment:
    1. MIDI ticks calculation doesn't match actual note timing
    2. BPM set correctly but timing conversion uses wrong formula
    3. Multiple tempo sources (config vs hardcoded) creating conflicts
    4. Ticks-per-quarter-note mismatch (e.g., 480 vs 960)
    5. Beat duration calculation using wrong time base

