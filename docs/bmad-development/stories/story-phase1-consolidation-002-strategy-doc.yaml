dev_notes:
  implementation_hints: |
    Feature Extraction Methodology:

    Step 1: File-by-File Analysis
    - Read each bmad_*.py file
    - Extract class definitions (what objects exist?)
    - Extract public functions (what capabilities?)
    - Note imports (what dependencies?)
    - Document unique algorithms or approaches

    Step 2: Feature Categorization
    - Music Generation Features (pattern creation, synthesis)
    - Audio Processing Features (effects, mixing, mastering)
    - Workflow Features (album generation, DJ export, batch processing)
    - Monitoring Features (performance tracking, QA, validation)
    - Integration Features (bridges to other systems)

    Step 3: Comparison Analysis
    - For each feature category, note which files implement it
    - Identify unique implementations vs shared approaches
    - Note quality differences (e.g., one implementation better than others)

    Step 4: Strategy Decision Framework
    - Complexity: How much work is each option?
    - Risk: Which option has lowest regression risk?
    - Quality: Which produces best code quality?
    - Timeline: Which meets 6-week epic timeline?
    - Alignment: Which best follows Story 001 architecture?

  reference_implementations: |
    Feature Inventory Template:
    ```markdown
    ## bmad_standalone.py (1,180 lines)

    ### Music Generation Features
    - [ ] MIDI pattern generation
    - [ ] Custom SimpleMIDIExporter class
    - [ ] Audio synthesis integration

    ### Dependencies
    - stdlib only (no external music libraries)
    - Audio rendering: [specify]

    ### Unique Capabilities
    - Self-contained operation (no cli_shared dependencies)
    - [Other unique features]

    ### Code Quality Notes
    - Hardcoded values: [count]
    - Data model: Custom (not Story 001)
    - Test coverage: [percentage if known]
    ```

  technical_decisions: |
    Decision Framework for Consolidation Strategy:

    Evaluate Each Option:
    1. Architecture Alignment: Does it follow Story 001 and Architecture Spec?
    2. Feature Preservation: Can it incorporate all experimental features?
    3. Code Quality: Will result be maintainable and testable?
    4. Timeline: Can it be completed within epic timeline (6 weeks)?
    5. Risk: What's the regression risk and rollback complexity?

    Scoring (1-5 scale for each criterion):
    - Option A: [scores]
    - Option B: [scores]
    - Option C: [scores]

    Recommendation: Highest total score + rationale

