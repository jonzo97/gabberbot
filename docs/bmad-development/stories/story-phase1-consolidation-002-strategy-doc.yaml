context:
  business_value: |
    Strategic Planning Foundation: Before consolidating 15,562 lines of experimental code
    across three parallel implementations, we MUST document what features exist, where they
    are, and which consolidation strategy to use.

    User Impact: Without this analysis, consolidation could lose working features that users
    depend on (83 sessions, 1660 patterns from 30-minute run). This story ensures we preserve
    all valuable functionality during migration.

    From Risk Assessment TECH-001 & BUS-001: "Three parallel implementations require choosing
    consolidation strategy. Loss of working functionality is critical risk requiring feature
    inventory and mapping."

  epic_relationship: |
    This story implements Epic Story 2: Strategy Documentation. It creates the roadmap for
    Stories 3-6 by documenting:
    - Complete feature inventory across all three implementations
    - Feature comparison matrix (what each implementation can do)
    - Consolidation strategy decision (Option A/B/C)
    - Feature preservation plan

    Gate Criteria: Consolidation strategy must be approved by @music-orchestrator before
    proceeding to Stories 3-6.

  current_state: |
    Three Parallel Implementations Exist:

    Implementation 1: bmad_standalone.py (1,180 lines)
    - Complete self-contained coordinator
    - Custom SimpleMIDIExporter class
    - Reimplements MIDI export independently
    - Zero external dependencies beyond stdlib

    Implementation 2: bmad_coordinator_lite.py (487 lines)
    - Uses cli_shared generators (AcidBasslineGenerator, TunedKickGenerator)
    - Uses cli_shared.models.midi_clips.MIDIClip
    - Integrates with existing infrastructure
    - Lighter weight, cleaner integration

    Implementation 3: bmad_simple_test.py (475 lines)
    - BMadSimpleCoordinator class
    - Different pattern generation approach
    - Custom mixing logic (BMadMixEngineer)
    - Different architecture from other two

    Supporting Files (13 additional):
    - bmad_hardcore_factory.py (808 lines) - attempts to orchestrate all three
    - bmad_album_producer.py - album generation features
    - bmad_dj_export.py - DJ set export features
    - bmad_qa_suite.py (2,000 lines) - quality assurance
    - bmad_performance_monitor.py - performance tracking
    - bmad_workflow_templates.py - workflow orchestration
    - + 7 more experimental files

  consolidation_options: |
    Option A: Extend Story 001 Models
    - Build consolidated implementation following Story 001 architecture
    - Extend Pydantic models to support all three use cases
    - Requires most architectural work but cleanest result
    - Timeline: 2-3 weeks for Story 5

    Option B: Use bmad_coordinator_lite.py as Base
    - Already uses cli_shared infrastructure
    - Add unique features from standalone and simple_test
    - Faster consolidation, good integration
    - Timeline: 1-2 weeks for Story 5

    Option C: Hybrid Approach
    - Use coordinator_lite as base
    - Add Story 001 model validation on top
    - Migrate features incrementally
    - Timeline: 2 weeks for Story 5

    Recommendation: To be determined by feature analysis in this story

